name: Governance checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check branch policy
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ "$BASE_REF" = "main" ] && [ "$HEAD_REF" = "main" ]; then
            echo 'Normal changes must not use main as the PR head.'
            exit 1
          fi

      - name: Require an issue reference
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | grep -Eiq '(#|closes |fixes |resolves )[0-9]+'; then
            echo 'PR must reference a GitHub Issue.'
            exit 1
          fi

      - name: Validate generated index
        run: |
          cp REPOSITORY_INDEX.md /tmp/REPOSITORY_INDEX.md.checked-in
          ./scripts/generate-repository-index.sh
          if ! cmp -s REPOSITORY_INDEX.md /tmp/REPOSITORY_INDEX.md.checked-in; then
            echo 'REPOSITORY_INDEX.md is out of date.'
            echo 'Run scripts/generate-repository-index.sh and commit the generated result.'
            exit 1
          fi
          echo 'REPOSITORY_INDEX.md matches the generator output.'

      - name: Flag governance changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          if printf '%s\n' "$changed" | grep -Eq '^(AGENTS\.md|AGENT_BOOTSTRAP_MEMORY\.md|\.github/workflows/|\.github/ISSUE_TEMPLATE/|\.github/PULL_REQUEST_TEMPLATE\.md)'; then
            echo 'Governance files changed: this is a high-risk governance change and requires human confirmation before merge.'
            echo 'CI cannot prove that a human performed the confirmation; repository settings should enforce the desired approval or environment policy.'
          fi
