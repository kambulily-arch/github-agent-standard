name: Maintain repository index

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  maintain-index:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild index
        run: bash scripts/generate-repository-index.sh

      - name: Detect generated changes
        id: diff
        shell: bash
        run: |
          if git diff --quiet -- REPOSITORY_INDEX.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update automation branch
        if: steps.diff.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C automation/generated-index
          git add REPOSITORY_INDEX.md
          git commit -m "chore: update generated repository index"
          git push --force-with-lease origin HEAD:automation/generated-index

      - name: Create or update generated-index pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head automation/generated-index --state open --json number --jq '.[0].number')"
          body="Automated repository-index refresh generated from the current main tree.\n\nDo not edit REPOSITORY_INDEX.md manually. This PR is generated by the repository-index workflow."

          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head automation/generated-index \
              --title "chore: update generated repository index" \
              --body "$body"
          fi

      - name: Confirm index is current
        if: steps.diff.outputs.changed == 'false'
        run: git diff --exit-code -- REPOSITORY_INDEX.md
