name: Governance gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: read
  pull-requests: write

jobs:
  detect-governance-change:
    name: detect-governance-change
    runs-on: ubuntu-latest
    outputs:
      governance_changed: ${{ steps.detect.outputs.governance_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          if printf '%s\n' "$changed" | grep -Eq '^(AGENTS\.md|AGENT_BOOTSTRAP_MEMORY\.md|GOVERNANCE\.md|\.github/workflows/|\.github/ISSUE_TEMPLATE/|\.github/PULL_REQUEST_TEMPLATE\.md|scripts/generate-repository-index\.sh)'; then
            echo 'governance_changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'governance_changed=false' >> "$GITHUB_OUTPUT"
          fi

  governance-human-confirmation:
    name: governance-human-confirmation
    needs: detect-governance-change
    if: ${{ needs.detect-governance-change.outputs.governance_changed == 'true' }}
    runs-on: ubuntu-latest
    environment: governance-human-confirmation
    steps:
      - name: Record explicit human confirmation
        run: |
          echo 'Governance change has received the configured GitHub environment approval.'
          echo 'The approval is an external human action and is not generated by this workflow.'

  governance-required:
    name: governance-required
    needs: [detect-governance-change, governance-human-confirmation]
    if: ${{ always() && (needs.governance-human-confirmation.result == 'success' || needs.governance-human-confirmation.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate required repository files
        run: |
          test -f AGENTS.md
          test -f AGENT_BOOTSTRAP_MEMORY.md
          test -f .github/PULL_REQUEST_TEMPLATE.md
          test -f .github/ISSUE_TEMPLATE/agent-change.md
          test -f scripts/generate-repository-index.sh

      - name: Validate branch policy and Issue reference
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$BASE_REF" = "main" ] && [ "$HEAD_REF" = "main" ]; then
            echo 'Normal changes must not use main as the PR head.'
            exit 1
          fi

          refs=$(printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | grep -Eio '(closes|fixes|resolves)[[:space:]]+#[0-9]+' | grep -Eo '[0-9]+' | sort -u || true)
          if [ -z "$refs" ]; then
            echo 'PR must contain an explicit closing Issue reference such as Closes #123.'
            exit 1
          fi

          for issue_number in $refs; do
            issue_json=$(gh api "/repos/$REPOSITORY/issues/$issue_number") || {
              echo "Referenced Issue #$issue_number does not exist."
              exit 1
            }
            if printf '%s' "$issue_json" | jq -e '.pull_request != null' >/dev/null; then
              echo "#${issue_number} is a pull request, not a work Issue."
              exit 1
            fi
            state=$(printf '%s' "$issue_json" | jq -r '.state')
            if [ "$state" != "open" ]; then
              echo "Referenced Issue #${issue_number} is not open."
              exit 1
            fi
          done

      - name: Validate generated repository index policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          cp REPOSITORY_INDEX.md /tmp/REPOSITORY_INDEX.md.checked-in
          bash scripts/generate-repository-index.sh

          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          if printf '%s\n' "$changed" | grep -qx 'REPOSITORY_INDEX.md'; then
            if ! cmp -s REPOSITORY_INDEX.md /tmp/REPOSITORY_INDEX.md.checked-in; then
              echo 'REPOSITORY_INDEX.md was changed but does not match generator output.'
              exit 1
            fi
            echo 'Generated index change matches generator output.'
          elif cmp -s REPOSITORY_INDEX.md /tmp/REPOSITORY_INDEX.md.checked-in; then
            echo 'Generated index is current.'
          else
            echo 'Generated index is stale because the repository tree changed.'
            echo 'Source PR is allowed to merge; post-merge automation must reconcile main through the generated-index PR.'
          fi

      - name: Final verification evidence
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Final Verification

          - PR: #${PR_NUMBER}
          - Repository: ${REPOSITORY}
          - Verified HEAD: \`${HEAD_SHA}\`
          - Required governance validation: PASS
          - Issue reference validation: PASS
          - Generated-index validation: PASS
          - Governance human-confirmation gate: PASS or not required
          - This evidence is tied to the exact PR HEAD above.
          EOF

      - name: Persist final verification in PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const marker = '<!-- final-verification -->';
            const body = `${marker}
            ## Final Verification

            - PR: #${context.payload.pull_request.number}
            - Verified HEAD: \`${context.payload.pull_request.head.sha}\`
            - Required governance validation: PASS
            - Issue reference validation: PASS
            - Generated-index validation: PASS
            - Governance human-confirmation gate: ${context.payload.pull_request.head.sha === context.payload.pull_request.base.sha ? 'not applicable' : 'PASS or not required'}
            - Recorded by the Governance gate workflow at ${new Date().toISOString()}

            This record is evidence for this exact PR HEAD; if the HEAD changes, a new verification record is required.`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100
            });
            const existing = comments.find(c => c.body && c.body.includes(marker) && c.user?.type === 'Bot');
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }
